name: Gardien Anti-Veille Streamlit

on:
  schedule:
    - cron: "0 */4 * * *" # S'exécute automatiquement toutes les 4 heures
  workflow_dispatch: # Permet de forcer le lancement manuellement depuis GitHub

jobs:
  reveiller-site:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Installation des dépendances du navigateur
        run: |
          pip install selenium webdriver-manager

      - name: Exécution du script de réveil
        run: python wake_up.py
